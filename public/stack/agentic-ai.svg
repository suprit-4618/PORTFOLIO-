<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="agentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="agentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <filter id="agentShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="250" cy="250" r="230" fill="url(#agentGlow)" />
  <circle cx="250" cy="250" r="210" fill="#090d16" stroke="url(#agentRing)" stroke-width="3" filter="url(#agentShadow)" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="10,6" opacity="0.4" />
  <circle cx="250" cy="250" r="150" fill="#200d19" stroke="#1e293b" stroke-width="2" />
  <!-- Swarm Nodes &amp; Agent Hub -->
  <g stroke="#f472b6" stroke-width="2" opacity="0.8">
    <circle cx="250" cy="250" r="24" fill="#db2777" stroke="#fbcfe8" stroke-width="3" />
    <!-- Orbiting Swarm Agents -->
    <line x1="250" y1="250" x2="190" y2="190" />
    <line x1="250" y1="250" x2="310" y2="190" />
    <line x1="250" y1="250" x2="320" y2="280" />
    <line x1="250" y1="250" x2="180" y2="280" />
    <line x1="250" y1="250" x2="250" y2="330" />
  </g>
  <circle cx="190" cy="190" r="11" fill="#ec4899" stroke="#fbcfe8" stroke-width="2.5" />
  <circle cx="310" cy="190" r="11" fill="#ec4899" stroke="#fbcfe8" stroke-width="2.5" />
  <circle cx="320" cy="280" r="11" fill="#ec4899" stroke="#fbcfe8" stroke-width="2.5" />
  <circle cx="180" cy="280" r="11" fill="#ec4899" stroke="#fbcfe8" stroke-width="2.5" />
  <circle cx="250" cy="330" r="11" fill="#ec4899" stroke="#fbcfe8" stroke-width="2.5" />
  <!-- Core Icon Symbol -->
  <polygon points="250,238 260,256 240,256" fill="#ffffff" />
  <text x="250" y="80" text-anchor="middle" fill="#fbcfe8" font-family="monospace" font-size="13" font-weight="700" letter-spacing="4">LLAMA 3.3 · GEMINI LIVE · FUNCTION CALLING</text>
  <text x="250" y="435" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="12" font-weight="600" letter-spacing="3">AUTONOMOUS SWARMS · COGNITIVE AGENTS</text>
</svg>