<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="afGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="afRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="afShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="250" cy="250" r="230" fill="url(#afGlow)" />
  <circle cx="250" cy="250" r="210" fill="#06131c" stroke="url(#afRing)" stroke-width="3" filter="url(#afShadow)" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="10,6" opacity="0.35" />
  <circle cx="250" cy="250" r="150" fill="#030c12" stroke="#1e293b" stroke-width="2" />
  <!-- Airflow Pinwheel Centerpiece -->
  <g transform="translate(250, 250)">
    <!-- 8 Orbiting nodes connected in a DAG cycle -->
    <circle cx="0" cy="0" r="16" fill="#06b6d4" stroke="#e0f2fe" stroke-width="3" />
    <g stroke="#38bdf8" stroke-width="2.5" opacity="0.8">
      <line x1="0" y1="0" x2="0" y2="-65" />
      <line x1="0" y1="0" x2="65" y2="0" />
      <line x1="0" y1="0" x2="0" y2="65" />
      <line x1="0" y1="0" x2="-65" y2="0" />
      <line x1="0" y1="-65" x2="55" y2="-55" />
      <line x1="65" y1="0" x2="55" y2="55" />
      <line x1="0" y1="65" x2="-55" y2="55" />
      <line x1="-65" y1="0" x2="-55" y2="-55" />
    </g>
    <circle cx="0" cy="-65" r="11" fill="#0284c7" stroke="#67e8f9" stroke-width="2.5" />
    <circle cx="65" cy="0" r="11" fill="#0284c7" stroke="#67e8f9" stroke-width="2.5" />
    <circle cx="0" cy="65" r="11" fill="#0284c7" stroke="#67e8f9" stroke-width="2.5" />
    <circle cx="-65" cy="0" r="11" fill="#0284c7" stroke="#67e8f9" stroke-width="2.5" />
    <circle cx="55" cy="-55" r="9" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
    <circle cx="55" cy="55" r="9" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
    <circle cx="-55" cy="55" r="9" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
    <circle cx="-55" cy="-55" r="9" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
  </g>
  <text x="250" y="80" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="13" font-weight="700" letter-spacing="4">APACHE AIRFLOW · DAG SCHEDULER</text>
  <text x="250" y="435" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600" letter-spacing="3">5-MIN CADENCE · CELERY EXECUTOR</text>
</svg>