<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="spatialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spatialRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="spatialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="250" cy="250" r="230" fill="url(#spatialGlow)" />
  <circle cx="250" cy="250" r="210" fill="#090d16" stroke="url(#spatialRing)" stroke-width="3" filter="url(#spatialShadow)" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="10,6" opacity="0.4" />
  <circle cx="250" cy="250" r="150" fill="#120c24" stroke="#1e293b" stroke-width="2" />
  <!-- 3D Polyhedral Cube / Octahedron Geometry -->
  <g stroke="#c084fc" stroke-width="2" fill="none" opacity="0.85">
    <polygon points="250,160 330,210 330,300 250,350 170,300 170,210" stroke="#a855f7" stroke-width="2.5" fill="#2e1065" fill-opacity="0.4" />
    <line x1="250" y1="160" x2="250" y2="255" stroke="#e9d5ff" stroke-width="2.5" />
    <line x1="170" y1="210" x2="250" y2="255" stroke="#e9d5ff" stroke-width="2.5" />
    <line x1="330" y1="210" x2="250" y2="255" stroke="#e9d5ff" stroke-width="2.5" />
    <line x1="250" y1="350" x2="250" y2="255" stroke="#c084fc" stroke-dasharray="4,4" />
    <circle cx="250" cy="255" r="7" fill="#ffffff" stroke="#c084fc" stroke-width="2" />
    <circle cx="250" cy="160" r="6" fill="#c084fc" />
    <circle cx="330" cy="210" r="6" fill="#c084fc" />
    <circle cx="330" cy="300" r="6" fill="#c084fc" />
    <circle cx="250" cy="350" r="6" fill="#c084fc" />
    <circle cx="170" cy="300" r="6" fill="#c084fc" />
    <circle cx="170" cy="210" r="6" fill="#c084fc" />
  </g>
  <text x="250" y="80" text-anchor="middle" fill="#e9d5ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="4">THREE.JS · WEBGL · MEDIAPIPE · REACT 19</text>
  <text x="250" y="435" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="12" font-weight="600" letter-spacing="3">60 FPS SPATIAL COMPUTE · GLSL SHADERS</text>
