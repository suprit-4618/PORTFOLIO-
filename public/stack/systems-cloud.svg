<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="sysGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sysRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="sysShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="250" cy="250" r="230" fill="url(#sysGlow)" />
  <circle cx="250" cy="250" r="210" fill="#090d16" stroke="url(#sysRing)" stroke-width="3" filter="url(#sysShadow)" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="12,6" opacity="0.4" />
  <circle cx="250" cy="250" r="150" fill="#191307" stroke="#1e293b" stroke-width="2" />
  <!-- Silicon Chip Architecture &amp; Terminal Matrix -->
  <rect x="190" y="190" width="120" height="120" rx="14" fill="#2a1f0a" stroke="#fbbf24" stroke-width="3" />
  <rect x="210" y="210" width="80" height="80" rx="8" fill="#171105" stroke="#f59e0b" stroke-width="2" />
  <!-- Terminal Prompt &amp; Code brackets -->
  <text x="250" y="258" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="28" font-weight="800">&gt;_</text>
  <!-- Silicon Pins -->
  <g stroke="#f59e0b" stroke-width="2.5">
    <line x1="210" y1="190" x2="210" y2="175" />
    <line x1="235" y1="190" x2="235" y2="175" />
    <line x1="265" y1="190" x2="265" y2="175" />
    <line x1="290" y1="190" x2="290" y2="175" />
    <line x1="210" y1="310" x2="210" y2="325" />
    <line x1="235" y1="310" x2="235" y2="325" />
    <line x1="265" y1="310" x2="265" y2="325" />
    <line x1="290" y1="310" x2="290" y2="325" />
    <line x1="190" y1="210" x2="175" y2="210" />
    <line x1="190" y1="235" x2="175" y2="235" />
    <line x1="190" y1="265" x2="175" y2="265" />
    <line x1="190" y1="290" x2="175" y2="290" />
    <line x1="310" y1="210" x2="325" y2="210" />
    <line x1="310" y1="235" x2="325" y2="235" />
    <line x1="310" y1="265" x2="325" y2="265" />
    <line x1="310" y1="290" x2="325" y2="290" />
  </g>
  <text x="250" y="80" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="13" font-weight="700" letter-spacing="4">FASTAPI · C++ · LINUX POSIX · DOCKER</text>
  <text x="250" y="435" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="600" letter-spacing="3">MICROSERVICES · ASYNC RUNTIMES · DAEMONS</text>
</svg>