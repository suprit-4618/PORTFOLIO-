<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aiRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="aiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Glow &amp; Outer Disc -->
  <circle cx="250" cy="250" r="230" fill="url(#aiGlow)" />
  <circle cx="250" cy="250" r="210" fill="#090d16" stroke="url(#aiRing)" stroke-width="3" filter="url(#aiShadow)" />
  <!-- Circuit Grid Pattern -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="6,6" opacity="0.4" />
  <circle cx="250" cy="250" r="150" fill="#0c1322" stroke="#1e293b" stroke-width="2" />
  <circle cx="250" cy="250" r="120" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="14,10" opacity="0.6" />
  <!-- Neural Network Centerpiece -->
  <g stroke="#34d399" stroke-width="2" opacity="0.75">
    <line x1="180" y1="200" x2="250" y2="170" />
    <line x1="180" y1="250" x2="250" y2="250" />
    <line x1="180" y1="300" x2="250" y2="330" />
    <line x1="180" y1="200" x2="250" y2="250" />
    <line x1="180" y1="300" x2="250" y2="250" />
    <line x1="250" y1="170" x2="320" y2="220" />
    <line x1="250" y1="250" x2="320" y2="220" />
    <line x1="250" y1="250" x2="320" y2="280" />
    <line x1="250" y1="330" x2="320" y2="280" />
  </g>
  <!-- Input Layer Nodes -->
  <circle cx="180" cy="200" r="9" fill="#10b981" stroke="#a7f3d0" stroke-width="2.5" />
  <circle cx="180" cy="250" r="9" fill="#10b981" stroke="#a7f3d0" stroke-width="2.5" />
  <circle cx="180" cy="300" r="9" fill="#10b981" stroke="#a7f3d0" stroke-width="2.5" />
  <!-- Hidden Layer Nodes -->
  <circle cx="250" cy="170" r="12" fill="#059669" stroke="#6ee7b7" stroke-width="3" />
  <circle cx="250" cy="250" r="16" fill="#34d399" stroke="#ffffff" stroke-width="3.5" />
  <circle cx="250" cy="330" r="12" fill="#059669" stroke="#6ee7b7" stroke-width="3" />
  <!-- Output Layer Nodes -->
  <circle cx="320" cy="220" r="11" fill="#10b981" stroke="#a7f3d0" stroke-width="3" />
  <circle cx="320" cy="280" r="11" fill="#10b981" stroke="#a7f3d0" stroke-width="3" />
  <!-- Tech Markings -->
  <text x="250" y="80" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="700" letter-spacing="4">PYTORCH · CUDA · TENSORFLOW</text>
  <text x="250" y="435" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="600" letter-spacing="3">NEURAL ARCHITECTURE · 35MS INFERENCE</text>
</svg>