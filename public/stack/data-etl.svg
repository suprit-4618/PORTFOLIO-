<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="dataGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dataRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="dataShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="250" cy="250" r="230" fill="url(#dataGlow)" />
  <circle cx="250" cy="250" r="210" fill="#090d16" stroke="url(#dataRing)" stroke-width="3" filter="url(#dataShadow)" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="8,6" opacity="0.4" />
  <circle cx="250" cy="250" r="150" fill="#0b1324" stroke="#1e293b" stroke-width="2" />
  <circle cx="250" cy="250" r="120" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="16,10" opacity="0.6" />
  <!-- Data Pipeline &amp; Database Iconography -->
  <g transform="translate(190, 175)">
    <!-- Top Disc -->
    <ellipse cx="60" cy="25" rx="55" ry="18" fill="#2563eb" stroke="#93c5fd" stroke-width="2.5" />
    <!-- Middle Tier -->
    <path d="M5,25 v35 c0,10 25,18 55,18 s55,-8 55,-18 v-35" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2" />
    <ellipse cx="60" cy="60" rx="55" ry="18" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,4" />
    <!-- Bottom Tier -->
    <path d="M5,60 v35 c0,10 25,18 55,18 s55,-8 55,-18 v-35" fill="#1e40af" stroke="#60a5fa" stroke-width="2" />
    <ellipse cx="60" cy="95" rx="55" ry="18" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,4" />
    <!-- Base Tier -->
    <path d="M5,95 v35 c0,10 25,18 55,18 s55,-8 55,-18 v-35" fill="#172554" stroke="#93c5fd" stroke-width="2.5" />
  </g>
  <!-- Orbiting DAG Arrows -->
  <path d="M125,250 A125,125 0 0,1 375,250" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,8" />
  <polygon points="375,245 385,255 365,255" fill="#93c5fd" />
  <text x="250" y="80" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="13" font-weight="700" letter-spacing="4">AIRFLOW · DBT · PYSPARK · POSTGRES</text>
  <text x="250" y="435" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="600" letter-spacing="3">DIMENSIONAL MODELING · DAG PIPELINES</text>
</svg>