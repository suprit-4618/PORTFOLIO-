<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="mpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#db2777" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mpRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <filter id="mpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="250" cy="250" r="230" fill="url(#mpGlow)" />
  <circle cx="250" cy="250" r="210" fill="#1c0a15" stroke="url(#mpRing)" stroke-width="3" filter="url(#mpShadow)" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="10,6" opacity="0.35" />
  <circle cx="250" cy="250" r="150" fill="#0f040b" stroke="#1e293b" stroke-width="2" />
  <!-- MediaPipe 21-Keypoint Hand Telemetry Wireframe -->
  <g stroke="#f472b6" stroke-width="2.5" opacity="0.85">
    <!-- Wrist to palm -->
    <line x1="250" y1="340" x2="220" y2="290" />
    <line x1="250" y1="340" x2="250" y2="280" />
    <line x1="250" y1="340" x2="280" y2="290" />
    <!-- Thumb -->
    <line x1="220" y1="290" x2="185" y2="270" />
    <line x1="185" y1="270" x2="165" y2="245" />
    <line x1="165" y1="245" x2="155" y2="220" />
    <!-- Index Finger -->
    <line x1="220" y1="290" x2="210" y2="235" />
    <line x1="210" y1="235" x2="205" y2="195" />
    <line x1="205" y1="195" x2="200" y2="160" />
    <!-- Middle Finger -->
    <line x1="250" y1="280" x2="250" y2="225" />
    <line x1="250" y1="225" x2="250" y2="185" />
    <line x1="250" y1="185" x2="250" y2="145" />
    <!-- Ring Finger -->
    <line x1="280" y1="290" x2="285" y2="235" />
    <line x1="285" y1="235" x2="290" y2="195" />
    <line x1="290" y1="195" x2="295" y2="165" />
    <!-- Pinky Finger -->
    <line x1="280" y1="290" x2="315" y2="260" />
    <line x1="315" y1="260" x2="325" y2="230" />
    <line x1="325" y1="230" x2="335" y2="200" />
  </g>
  <!-- 21 Landmark Nodes -->
  <circle cx="250" cy="340" r="7" fill="#ffffff" stroke="#ec4899" stroke-width="2" />
  <circle cx="220" cy="290" r="5" fill="#f472b6" />
  <circle cx="185" cy="270" r="5" fill="#f472b6" />
  <circle cx="165" cy="245" r="5" fill="#f472b6" />
  <circle cx="155" cy="220" r="6" fill="#ffffff" />
  <circle cx="210" cy="235" r="5" fill="#f472b6" />
  <circle cx="205" cy="195" r="5" fill="#f472b6" />
  <circle cx="200" cy="160" r="6" fill="#ffffff" />
  <circle cx="250" cy="280" r="5" fill="#f472b6" />
  <circle cx="250" cy="225" r="5" fill="#f472b6" />
  <circle cx="250" cy="185" r="5" fill="#f472b6" />
  <circle cx="250" cy="145" r="6" fill="#ffffff" />
  <circle cx="280" cy="290" r="5" fill="#f472b6" />
  <circle cx="285" cy="235" r="5" fill="#f472b6" />
  <circle cx="290" cy="195" r="5" fill="#f472b6" />
  <circle cx="295" cy="165" r="6" fill="#ffffff" />
  <circle cx="315" cy="260" r="5" fill="#f472b6" />
  <circle cx="325" cy="230" r="5" fill="#f472b6" />
  <circle cx="335" cy="200" r="6" fill="#ffffff" />
  <text x="250" y="80" text-anchor="middle" fill="#fbcfe8" font-family="monospace" font-size="13" font-weight="700" letter-spacing="4">MEDIAPIPE VISION · 21 LANDMARKS</text>
  <text x="250" y="435" text-anchor="middle" fill="#f472b6" font-family="monospace" font-size="12" font-weight="600" letter-spacing="3">60 FPS SPATIAL TRACKING · ZERO-SERVER</text>
</svg>