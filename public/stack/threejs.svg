<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="threeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="threeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="threeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="250" cy="250" r="230" fill="url(#threeGlow)" />
  <circle cx="250" cy="250" r="210" fill="#0f0a1c" stroke="url(#threeRing)" stroke-width="3" filter="url(#threeShadow)" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="10,6" opacity="0.35" />
  <circle cx="250" cy="250" r="150" fill="#090514" stroke="#1e293b" stroke-width="2" />
  <!-- Three.js Iconic Polyhedron Geometry -->
  <g stroke="#d8b4fe" stroke-width="2.5" fill="none">
    <polygon points="250,160 330,210 330,300 250,350 170,300 170,210" stroke="#a855f7" stroke-width="3" fill="#3b0764" fill-opacity="0.4" />
    <line x1="250" y1="160" x2="250" y2="255" stroke="#ffffff" stroke-width="2.5" />
    <line x1="170" y1="210" x2="250" y2="255" stroke="#ffffff" stroke-width="2.5" />
    <line x1="330" y1="210" x2="250" y2="255" stroke="#ffffff" stroke-width="2.5" />
    <line x1="250" y1="350" x2="250" y2="255" stroke="#c084fc" stroke-dasharray="4,4" />
    <circle cx="250" cy="255" r="8" fill="#ffffff" stroke="#a855f7" stroke-width="2.5" />
    <circle cx="250" cy="160" r="6" fill="#a855f7" />
    <circle cx="330" cy="210" r="6" fill="#a855f7" />
    <circle cx="330" cy="300" r="6" fill="#a855f7" />
    <circle cx="250" cy="350" r="6" fill="#a855f7" />
    <circle cx="170" cy="300" r="6" fill="#a855f7" />
    <circle cx="170" cy="210" r="6" fill="#a855f7" />
  </g>
  <text x="250" y="80" text-anchor="middle" fill="#e9d5ff" font-family="monospace" font-size="13" font-weight="700" letter-spacing="4">THREE.JS · WEBGL · GLSL SHADERS</text>
  <text x="250" y="435" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="12" font-weight="600" letter-spacing="3">60 FPS REAL-TIME · 3D CANNON-ES</text>
</svg>